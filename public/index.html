<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Production Report App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Operations overview</p>
          <h1>Production Report</h1>
        </div>
        <button id="refreshButton" class="primary-button">Refresh report</button>
      </header>

      <main class="dashboard">
        <section class="summary-grid" id="summaryGrid"></section>

        <section class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Performance snapshot</p>
              <h2>Line performance</h2>
            </div>
            <span id="summaryText" class="status-pill"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Line</th>
                  <th>Shift</th>
                  <th>Target</th>
                  <th>Actual</th>
                  <th>Efficiency</th>
                  <th>Quality</th>
                  <th>Downtime</th>
                </tr>
              </thead>
              <tbody id="lineTableBody"></tbody>
            </table>
          </div>
        </section>

        <section class="panel two-column">
          <div>
            <div class="panel-header compact">
              <div>
                <p class="eyebrow">Factory output</p>
                <h2>Production trend</h2>
              </div>
            </div>
            <div id="trendChart" class="trend-chart" aria-label="Production trend chart"></div>
          </div>

          <div>
            <div class="panel-header compact">
              <div>
                <p class="eyebrow">Action items</p>
                <h2>Alerts</h2>
              </div>
            </div>
            <ul id="alertList" class="alerts"></ul>
          </div>
        </section>
      </main>
    </div>

    <script src="../report.js"></script>
    <script src="app.js"></script>
  </body>
</html>
